server:
  port: 8082
spring:
  application:
    name: automation-service
  security:
    user:
      name: admin
      password: admin 
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/samaritan}
  jpa:
    open-in-view: false 
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/ureka/
