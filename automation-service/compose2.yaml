services:
  automation-service:
    build:
      context: ..
      dockerfile: automation-service/Dockerfile
    ports:
      - 8082:8082
    environment:
      EUREKA_DEFAULT_ZONE: http://admin:admin@eureka-service:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/samaritan
    depends_on:
      eureka-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_DATABASE: automationdb
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  browser:
    image: lightpanda/browser:latest
    ports:
      - 9222:9222
volumes:
  mongodb_data:
  mongodb_config:

