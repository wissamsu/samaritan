  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #     keycloak:
  #       condition: service_started
  #   restart: on-failure
  postgres:
    image: postgres:19-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: userdb
    volumes:
      - userdb_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d userdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres_keycloak:
    image: postgres:19-alpine
    ports:
      - 5433:5432
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - keycloakdb_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d keycloakdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    ports:
      - "9000:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloakdb
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    volumes:
      - ./realm-export/samaritan-realm.json:/opt/keycloak/data/import/samaritan-realm.json:ro
    depends_on:
      postgres_keycloak:
        condition: service_healthy

volumes:
  userdb_data:
  keycloakdb_data:
