services:
  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    ports:
      - 8081:8081
    depends_on:
      eureka-service:
        condition: service_healthy
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: userdb
    volumes:
      - userdb_data:/var/lib/postgresql
  postgres_keycloak:
    image: postgres:latest
    ports:
      - 5433:5432
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - keycloakdb_data:/var/lib/postgresql
    networks:
      keycloak_network:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_keycloak -d postgres_keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    ports:
      - "9000:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloakdb
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    volumes:
      - ./realm-export/samaritan-realm.json:/opt/keycloak/data/import/samaritan-realm.json:ro
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    networks:
      keycloak_network:

volumes:
  userdb_data:
  keycloakdb_data:
networks:
  keycloak_network:
    driver: bridge
