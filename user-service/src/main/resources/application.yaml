server:
  port: 8081
  servlet:
    context-path: /api/user-service 
eureka:
  client:
    serviceUrl:
      defaultZone: http://admin:admin@localhost:8761/eureka/
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb 
    username: admin
    password: admin 
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false 
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/samaritan
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:9000/realms/samaritan 
        registration:
          keycloak:
            client-id: samaritan  
            client-secret: PXnhBrcPC5lFQ9YOIMjgJSBcxuDEkoa92DcGEAYieeaoosWjdvS02yU59nplD4pTucjT50QieSFHh7hSAv4lzR
            scope: openid,profile,email
  docker:
    compose:
      enabled: false 
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: user-service 
      auto-offset-reset: earliest 
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  threads:
    virtual:
      enabled: true
  grpc:
    server:
      enabled: false
    client:
      enabled: false
