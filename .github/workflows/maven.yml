name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven no tests
      run: mvn clean compile

    - name: with tests
      run: mvn -B clean verify

    - name: run docker compose
      run: docker compose -f compose2.yaml up -d --build --wait

    - name: check logs on failure
      if: failure()
      run: docker compose -f compose2.yaml logs --tail=200

  CD:
    needs: CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: wissamsu
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: pushes images
      run: |
        docker compose -f compose2.yaml build user-service api-gateway eureka-service automation-service
        docker compose -f compose2.yaml push user-service api-gateway eureka-service automation-service
