services:
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    ports:
      - 8080:8080
    depends_on:
      eureka-service:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:8.12-rc3-alpine
    ports:
      - 6379:6379
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "secret123" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
