services:
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    ports:
      - 8080:8080
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: secret123
      EUREKA_DEFAULT_ZONE: http://admin:admin@eureka-service:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/samaritan
    depends_on:
      eureka-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
    restart: on-failure
  redis:
    image: redis:8.12-rc3-alpine
    ports:
      - 6379:6379
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "secret123" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "secret123", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
