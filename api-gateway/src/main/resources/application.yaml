server:
  port: 8080 
eureka:
  client:
    serviceUrl:
      defaultZone: http://admin:admin@localhost:8761/eureka/
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/samaritan
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:9000/realms/samaritan  
        registration:
          keycloak:
            client-id: samaritan
            client-secret: PXnhBrcPC5lFQ9YOIMjgJSBcxuDEkoa92DcGEAYieeaoosWjdvS02yU59nplD4pTucjT50QieSFHh7hSAv4lzR
            scope: openid,profile,email
  threads:
    virtual:
      enabled: true 
  data:
    redis:
      port: 6379 
      password: secret123  
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: user-service
            uri: lb://user-service
            predicates: Path=/api/user-service/**
            filters:
            - name: RequestRateLimiter
              args: 
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20
                "[redis-rate-limiter.requestedTokens]": 1
            - name: CircuitBreaker
              args:
                name: user-service-CB
                fallbackUri: forward:/fallback/user-service
