server:
  port: 8080
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://admin:admin@localhost:8761/eureka/}
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/samaritan}
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/samaritan}
        registration:
          keycloak:
            client-id: samaritan
            client-secret: t7rqN5xqUTyoDgVH9tpjMaeotIDJGN4fjJu8fdfG2eCpIkh9PE1MbZq80z0jUsgeOOtOXy735zAlSpWFkNextm
            scope: openid,profile,email
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:secret123}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user-service/**
              filters:
                - TokenRelay=
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    "[redis-rate-limiter.replenishRate]": 10
                    "[redis-rate-limiter.burstCapacity]": 20
                    "[redis-rate-limiter.requestedTokens]": 1
                - name: CircuitBreaker
                  args:
                    name: user-service-CB
                    fallbackUri: forward:/fallback/user-service
